<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>公共事業入札案件調査</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fa;
      --panel: #ffffff;
      --ink: #1f2933;
      --muted: #64748b;
      --line: #d9e2ec;
      --brand: #0f766e;
      --brand-strong: #115e59;
      --warn: #a16207;
      --chip: #e7f6f3;
      --shadow: 0 12px 32px rgba(31, 41, 55, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      background: var(--bg);
      color: var(--ink);
      letter-spacing: 0;
    }

    header {
      background: #12343b;
      color: #fff;
      border-bottom: 4px solid #d8a31a;
    }

    .header-inner {
      max-width: 1440px;
      margin: 0 auto;
      padding: 22px 24px 18px;
      display: grid;
      gap: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 2.2vw, 2rem);
      font-weight: 700;
    }

    .status-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      color: #dbeafe;
      font-size: 0.92rem;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 5px 10px;
      border: 1px solid rgba(255, 255, 255, 0.26);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      white-space: nowrap;
    }

    .pill.source-link {
      color: #dffcf8;
      text-decoration: none;
    }

    .pill.source-link:hover {
      border-color: rgba(255, 255, 255, 0.55);
    }

    main {
      max-width: 1440px;
      margin: 0 auto;
      padding: 18px 24px 32px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1.4fr) repeat(3, minmax(160px, 0.7fr)) auto auto;
      gap: 10px;
      align-items: end;
      margin-bottom: 14px;
    }

    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
    }

    input,
    select,
    button {
      min-height: 38px;
      border-radius: 6px;
      border: 1px solid var(--line);
      font: inherit;
    }

    input,
    select {
      width: 100%;
      padding: 8px 10px;
      background: #fff;
      color: var(--ink);
    }

    input[type="file"] {
      max-width: 260px;
      padding: 7px;
      font-size: 0.82rem;
    }

    button {
      padding: 8px 13px;
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      background: #fff;
      color: var(--brand-strong);
      border-color: #9ad5cd;
    }

    button:hover {
      filter: brightness(0.97);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .metric {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 13px 14px;
      box-shadow: var(--shadow);
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
    }

    .metric strong {
      display: block;
      margin-top: 5px;
      font-size: 1.35rem;
      line-height: 1;
    }

    .table-wrap {
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      max-height: calc(100vh - 270px);
    }

    table {
      width: 100%;
      min-width: 1120px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    thead {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #edf4f2;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 10px 11px;
      text-align: left;
      vertical-align: top;
      font-size: 0.88rem;
      line-height: 1.45;
    }

    th {
      color: #334155;
      font-size: 0.76rem;
      letter-spacing: 0;
      white-space: nowrap;
    }

    tbody tr:hover {
      background: #f8fbfb;
    }

    .col-retrieved { width: 142px; }
    .col-pref { width: 88px; }
    .col-agency { width: 130px; }
    .col-type { width: 120px; }
    .col-title { width: auto; }
    .col-date { width: 110px; }
    .col-url { width: 96px; }
    .col-source { width: 170px; }

    .type-chip {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--chip);
      color: #0f5f57;
      font-size: 0.78rem;
      font-weight: 700;
      max-width: 100%;
    }

    .link {
      color: var(--brand-strong);
      font-weight: 700;
      text-decoration: none;
    }

    .link:hover {
      text-decoration: underline;
    }

    .empty {
      padding: 28px;
      color: var(--muted);
      text-align: center;
    }

    .notice {
      margin: 10px 0 14px;
      color: var(--warn);
      font-size: 0.88rem;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 980px) {
      .toolbar {
        grid-template-columns: 1fr 1fr;
      }

      .summary {
        grid-template-columns: 1fr 1fr;
      }

      input[type="file"] {
        max-width: 100%;
      }
    }

    @media (max-width: 640px) {
      .header-inner,
      main {
        padding-left: 14px;
        padding-right: 14px;
      }

      .toolbar,
      .summary {
        grid-template-columns: 1fr;
      }

      .table-wrap {
        max-height: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>公共事業入札案件調査</h1>
      <div class="status-row">
        <span class="pill" id="generatedAt">更新日時 -</span>
        <span class="pill" id="recordCount">0件</span>
        <span class="pill">土木工事系除外</span>
        <a class="pill source-link" href="https://www.kkj.go.jp/s/" target="_blank" rel="noopener">官公需情報ポータルAPI使用</a>
      </div>
    </div>
  </header>

  <main>
    <section class="toolbar" aria-label="絞り込み">
      <label>
        キーワード
        <input id="searchInput" type="search" placeholder="件名・発注機関・取得元">
      </label>
      <label>
        都道府県
        <select id="prefectureFilter">
          <option value="">すべて</option>
        </select>
      </label>
      <label>
        案件種別
        <select id="typeFilter">
          <option value="">すべて</option>
        </select>
      </label>
      <label>
        並び順
        <select id="sortOrder">
          <option value="announcement_desc">公告日 新しい順</option>
          <option value="retrieved_desc">取得日時 新しい順</option>
          <option value="prefecture_asc">都道府県順</option>
        </select>
      </label>
      <button id="reloadButton" type="button">最新データ再読込</button>
    </section>

    <div class="notice hidden" id="notice"></div>

    <section class="summary" aria-label="集計">
      <div class="metric"><span>表示件数</span><strong id="visibleMetric">0</strong></div>
      <div class="metric"><span>取得元</span><strong id="sourceMetric">0</strong></div>
      <div class="metric"><span>都道府県</span><strong id="prefMetric">0</strong></div>
      <div class="metric"><span>最新公告日</span><strong id="latestMetric">-</strong></div>
    </section>

    <section class="table-wrap" aria-label="案件一覧">
      <table>
        <thead>
          <tr>
            <th class="col-retrieved">取得日時</th>
            <th class="col-pref">都道府県</th>
            <th class="col-agency">発注機関</th>
            <th class="col-type">案件種別</th>
            <th class="col-title">件名</th>
            <th class="col-date">公告日</th>
            <th class="col-url">案件URL</th>
            <th class="col-source">取得元</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty hidden" id="emptyState">該当する案件はありません。</div>
    </section>
  </main>

  <script>
    const state = {
      items: [],
      generatedAt: "",
      filtered: []
    };

    const dom = {
      generatedAt: document.getElementById("generatedAt"),
      recordCount: document.getElementById("recordCount"),
      searchInput: document.getElementById("searchInput"),
      prefectureFilter: document.getElementById("prefectureFilter"),
      typeFilter: document.getElementById("typeFilter"),
      sortOrder: document.getElementById("sortOrder"),
      reloadButton: document.getElementById("reloadButton"),
      notice: document.getElementById("notice"),
      visibleMetric: document.getElementById("visibleMetric"),
      sourceMetric: document.getElementById("sourceMetric"),
      prefMetric: document.getElementById("prefMetric"),
      latestMetric: document.getElementById("latestMetric"),
      tbody: document.getElementById("tbody"),
      emptyState: document.getElementById("emptyState")
    };

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function normalize(value) {
      return String(value ?? "").trim().toLowerCase();
    }

    function asArray(data) {
      if (Array.isArray(data)) return data;
      if (data && Array.isArray(data.items)) return data.items;
      return [];
    }

    async function loadData() {
      hideNotice();
      try {
        const response = await fetch(`data/bids.json?ts=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        setData(data);
      } catch (error) {
        showNotice("data/bids.jsonを自動読込できませんでした。GitHub Actionsの取得完了後に再読み込みしてください。");
      }
    }

    function setData(data) {
      state.items = asArray(data);
      state.generatedAt = data.generated_at || "";
      dom.generatedAt.textContent = state.generatedAt ? `更新日時 ${formatDateTime(state.generatedAt)}` : "更新日時 -";
      dom.recordCount.textContent = `${state.items.length}件`;
      populateFilters();
      render();
    }

    function populateFilters() {
      const currentPref = dom.prefectureFilter.value;
      const currentType = dom.typeFilter.value;
      fillSelect(dom.prefectureFilter, unique(state.items.map((item) => item.prefecture)), currentPref);
      fillSelect(dom.typeFilter, unique(state.items.map((item) => item.case_type)), currentType);
    }

    function fillSelect(select, values, current) {
      select.innerHTML = '<option value="">すべて</option>';
      values.forEach((value) => {
        if (!value) return;
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      });
      select.value = values.includes(current) ? current : "";
    }

    function unique(values) {
      return [...new Set(values.filter(Boolean))].sort((a, b) => String(a).localeCompare(String(b), "ja"));
    }

    function render() {
      const keyword = normalize(dom.searchInput.value);
      const prefecture = dom.prefectureFilter.value;
      const type = dom.typeFilter.value;

      state.filtered = state.items.filter((item) => {
        const haystack = normalize([
          item.prefecture,
          item.agency,
          item.case_type,
          item.title,
          item.source
        ].join(" "));
        return (!keyword || haystack.includes(keyword))
          && (!prefecture || item.prefecture === prefecture)
          && (!type || item.case_type === type);
      });

      sortItems(state.filtered);
      renderMetrics();
      renderTable();
    }

    function sortItems(items) {
      const order = dom.sortOrder.value;
      const byText = (a, b, key) => String(a[key] || "").localeCompare(String(b[key] || ""), "ja");
      items.sort((a, b) => {
        if (order === "prefecture_asc") return byText(a, b, "prefecture") || byText(a, b, "agency");
        if (order === "retrieved_desc") return String(b.retrieved_at || "").localeCompare(String(a.retrieved_at || ""));
        return String(b.announcement_date || "").localeCompare(String(a.announcement_date || ""))
          || String(b.retrieved_at || "").localeCompare(String(a.retrieved_at || ""));
      });
    }

    function renderMetrics() {
      const sources = new Set(state.filtered.map((item) => item.source).filter(Boolean));
      const prefs = new Set(state.filtered.map((item) => item.prefecture).filter(Boolean));
      const latest = state.filtered.map((item) => item.announcement_date).filter(Boolean).sort().at(-1);
      dom.visibleMetric.textContent = state.filtered.length;
      dom.sourceMetric.textContent = sources.size;
      dom.prefMetric.textContent = prefs.size;
      dom.latestMetric.textContent = latest || "-";
    }

    function renderTable() {
      dom.tbody.innerHTML = state.filtered.map((item) => {
        const url = item.url || "";
        const link = url
          ? `<a class="link" href="${escapeHtml(url)}" target="_blank" rel="noopener">開く</a>`
          : "";
        return `
          <tr>
            <td>${escapeHtml(item.retrieved_at || "")}</td>
            <td>${escapeHtml(item.prefecture || "")}</td>
            <td>${escapeHtml(item.agency || "")}</td>
            <td><span class="type-chip">${escapeHtml(item.case_type || "その他")}</span></td>
            <td>${escapeHtml(item.title || "")}</td>
            <td>${escapeHtml(item.announcement_date || "")}</td>
            <td>${link}</td>
            <td>${escapeHtml(item.source || "")}</td>
          </tr>
        `;
      }).join("");
      dom.emptyState.classList.toggle("hidden", state.filtered.length > 0);
    }

    function formatDateTime(value) {
      const parsed = new Date(value);
      if (!Number.isNaN(parsed.getTime())) {
        return parsed.toLocaleString("ja-JP", { hour12: false });
      }
      return value;
    }

    function showNotice(message) {
      dom.notice.textContent = message;
      dom.notice.classList.remove("hidden");
    }

    function hideNotice() {
      dom.notice.textContent = "";
      dom.notice.classList.add("hidden");
    }

    dom.searchInput.addEventListener("input", render);
    dom.prefectureFilter.addEventListener("change", render);
    dom.typeFilter.addEventListener("change", render);
    dom.sortOrder.addEventListener("change", render);
    dom.reloadButton.addEventListener("click", loadData);

    loadData();
  </script>
</body>
</html>
